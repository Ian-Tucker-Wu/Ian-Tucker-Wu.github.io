<!DOCTYPE html>
<html>
<head>
<title>HTML PowerPoint</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

.slide {
    display: none;
    height: 100vh;
    width: 100%;
    text-align: center;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.active {
    display: flex;
}

h1 {
    font-size: 70px;
}

p {
    font-size: 35px;
}

button {
    position: fixed;
    bottom: 30px;
    padding: 15px 30px;
    font-size: 20px;
    cursor: pointer;
    border-radius: 10px;
    border: none;
}

#prev {
    left: 30px;
}

#next {
    right: 30px;
}
</style>
</head>

<body>

<div class="slide active">
    <h1>Words</h1>
    <p>abomination aboriginal aborigine abound about about above above above aboveaboard aboveaboard abracadabra abrade abrasive abrasive</p>
</div>
<button id="prev">⬅ Previous</button>
<button id="next">Next ➡</button>


<script>
let slides = document.querySelectorAll(".slide");
let current = 0;

function showSlide(index) {
    slides[current].classList.remove("active");
    current = index;
    slides[current].classList.add("active");
}

document.getElementById("next").onclick = function() {
    let next = current + 1;
    if(next >= slides.length) next = 0;
    showSlide(next);
}

document.getElementById("prev").onclick = function() {
    let prev = current - 1;
    if(prev < 0) prev = slides.length - 1;
    showSlide(prev);
}

document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") {
        document.getElementById("next").click();
    }
    if(e.key === "ArrowLeft") {
        document.getElementById("prev").click();
    }
});
</script>

</body>
</html>
