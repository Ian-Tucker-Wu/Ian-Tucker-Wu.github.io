<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Egg Clicker Ultimate</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-color: #f8f9fa;
            --accent-color: #fbc531;
            --panel-bg: #2d2d3a;
            --hover-bg: #3f3f5a;
            --egg-color: #e1b12c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid var(--panel-bg);
            padding: 20px;
            background: radial-gradient(circle at center, #2d2d3a 0%, #1a1a24 100%);
        }

        #right-panel {
            flex: 1.2;
            padding: 20px;
            background-color: #15151e;
            overflow-y: auto;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #score-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--egg-color);
            text-shadow: 0 0 10px rgba(225, 177, 44, 0.3);
        }

        #stats {
            font-size: 1.2rem;
            color: #a4b0be;
            margin-bottom: 40px;
        }

        /* The main clickable element */
        #click-button {
            font-size: 150px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 40px rgba(251, 197, 49, 0.4));
        }

        #click-button:active {
            transform: scale(0.85);
        }

        /* Store styling */
        h2 {
            border-bottom: 2px solid var(--panel-bg);
            padding-bottom: 10px;
            margin-top: 0;
            color: var(--accent-color);
            position: sticky;
            top: 0;
            background-color: #15151e;
            z-index: 10;
            padding-top: 10px;
        }

        .upgrade-card {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            border-left: 4px solid transparent;
        }

        .upgrade-card:hover {
            background-color: var(--hover-bg);
            border-left: 4px solid var(--accent-color);
        }

        .upgrade-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-left: 4px solid transparent;
        }

        .upgrade-info h3 {
            margin: 0 0 5px 0;
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #a4b0be;
        }

        .upgrade-cost {
            font-weight: bold;
            font-size: 1rem;
            color: var(--egg-color);
            margin-top: 5px;
            display: inline-block;
        }

        .upgrade-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            min-width: 40px;
            text-align: right;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--panel-bg); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-bg); }
    </style>
</head>
<body>

    <div id="left-panel">
        <h1>Blox Egg Clicker</h1>
        <div id="score-display">0 Eggs</div>
        <div id="stats">
            <span id="cps-display">0</span> Eggs/sec &nbsp;|&nbsp; 
            <span id="cpc-display">1</span> Eggs/click
        </div>
        
        <button id="click-button" onclick="clickMain()">🥚</button>
    </div>

    <div id="right-panel">
        <h2>Power Shop</h2>
        <div id="store-container">
            <!-- Upgrades generated here -->
        </div>
    </div>

    <script>
        // Game State Variables
        let score = 0;
        let eggsPerSecond = 0;
        let eggsPerClick = 1;

        // The Massive Item List (Now including Fighting Styles!)
        const rawItems = [
            // Fighting Styles
            "Combat", "Dark Step", "Death Step", "Dragon Breath", "Dragon Talon", "Electric", "Electric Claw", "Godhuman", "Sanguine Art", "Sharkman Karate", "Superhuman", "Water Kung Fu",
            // Fruits
            "Barrier", "Blade", "Blizzard", "Bomb", "Buddha", "Chop", "Control", "Creation", "Dark", "Diamond", "Door", "Dough", "Dragon", "Dragon (Classic)", "Eagle", "Falcon", "Flame", "Gas", "Ghost", "Gravity", "Ice", "Kilo", "Kitsune", "Leopard", "Light", "Lightning", "Love", "Magma", "Mammoth", "Meme", "Meme (Obtainable)", "Pain", "Phoenix", "Portal", "Quake", "Revive", "Rocket", "Rogue", "Rubber", "Sand", "Shadow", "Smoke", "Soul", "Sound", "Spider", "Spike", "Spin", "Spirit", "Spring", "T-Rex", "Tiger", "Venom", "Yeti",
            // Swords
            "Bisento", "Buddy Sword", "Canvander", "Cursed Dual Katana", "Cutlass", "Dark Blade", "Dark Dagger", "Dragon Trident", "Dragonheart", "Dual Katana", "Dual-Headed Blade", "Fishing Trophy", "Flail", "Fox Lamp", "Gravity Blade", "Hallow Scythe", "Iron Mace", "Katana", "Koko", "Longsword", "Midnight Blade", "Oroshi", "Pipe", "Pole (1st Form)", "Pole (2nd Form)", "Rengoku", "Saber", "Saishi", "Shark Anchor", "Shark Saw", "Shizu", "Soul Cane", "Spikey Trident", "Trident", "Triple Dark Blade", "Triple Katana", "True Triple Katana", "Tushita", "Twin Hooks", "Wardens Sword", "Yama",
            // Guns
            "Acidum Rifle", "Bazooka", "Bizarre Revolver", "Bizarre Rifle", "Cannon", "Dragonstorm", "Dual Flintlock", "Flintlock", "Kabucha", "Magma Blaster", "Musket", "Refined Flintlock", "Refined Musket", "Refined Slingshot", "Shotgun", "Skull Guitar", "Slingshot", "Venom Bow"
        ];

        // Dynamically Generate the Store Items based on the list
        const storeItems = rawItems.map((name, index) => {
            // Every 4th item increases your CLICK power instead of AUTO power
            const isClickUpgrade = (index % 4 === 0); 
            
            // Exponentially scale the cost and power so late-game items are insanely strong
            let baseCost = Math.floor(15 * Math.pow(1.25, index));
            let power = Math.floor(1 * Math.pow(1.18, index));
            if (power < 1) power = 1;

            return {
                id: name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(),
                name: name,
                description: isClickUpgrade ? `+${formatNumber(power)} Eggs per click` : `+${formatNumber(power)} Eggs per sec`,
                baseCost: baseCost,
                cost: baseCost,
                count: 0,
                type: isClickUpgrade ? 'click' : 'auto',
                power: power
            };
        });

        // Formatter for huge numbers (M, B, T, Qa)
        function formatNumber(num) {
            if (num >= 1e15) return (num / 1e15).toFixed(2) + ' Qa';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + ' T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' M';
            return Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Core Game Functions
        function clickMain() {
            score += eggsPerClick;
            updateUI();
        }

        function buyItem(index) {
            let item = storeItems[index];

            if (score >= item.cost) {
                score -= item.cost;
                item.count++;

                if (item.type === 'click') {
                    eggsPerClick += item.power;
                } else if (item.type === 'auto') {
                    eggsPerSecond += item.power;
                }

                // 1.15x price scaling per purchase
                item.cost = Math.ceil(item.baseCost * Math.pow(1.15, item.count));

                renderStore();
                updateUI();
            }
        }

        // UI Updates
        function updateUI() {
            document.getElementById('score-display').innerText = formatNumber(score) + ' Eggs';
            document.getElementById('cps-display').innerText = formatNumber(eggsPerSecond);
            document.getElementById('cpc-display').innerText = formatNumber(eggsPerClick);

            const cards = document.querySelectorAll('.upgrade-card');
            cards.forEach((card, index) => {
                if (score >= storeItems[index].cost) {
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                }
            });
        }

        function renderStore() {
            const container = document.getElementById('store-container');
            container.innerHTML = ''; 

            storeItems.forEach((item, index) => {
                const card = document.createElement('div');
                const disabledClass = score >= item.cost ? '' : 'disabled';
                
                card.className = `upgrade-card ${disabledClass}`;
                card.onclick = () => buyItem(index);

                // Add a small tag to show if it's a Click or Auto upgrade
                const tagColor = item.type === 'click' ? '#ff7675' : '#74b9ff';
                const tag = `<span style="color:${tagColor}; font-size:0.8rem; font-weight:bold;">[${item.type.toUpperCase()}]</span>`;

                card.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${item.name} ${tag}</h3>
                        <p>${item.description}</p>
                        <span class="upgrade-cost">Cost: ${formatNumber(item.cost)} Eggs</span>
                    </div>
                    <div class="upgrade-count">${item.count}</div>
                `;
                container.appendChild(card);
            });
        }

        // Game Loop (Runs 10 times a second for smoother numbers)
        setInterval(() => {
            if (eggsPerSecond > 0) {
                score += (eggsPerSecond / 10);
                updateUI();
            }
        }, 100);

        // Initial setup
        renderStore();
        updateUI();

    </script>
</body>
</html>
