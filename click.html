<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Egg Clicker: Categories</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-color: #f8f9fa;
            --accent-color: #fbc531;
            --panel-bg: #2d2d3a;
            --hover-bg: #3f3f5a;
            --egg-color: #e1b12c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid var(--panel-bg);
            padding: 20px;
            background: radial-gradient(circle at center, #2d2d3a 0%, #1a1a24 100%);
        }

        #right-panel {
            flex: 1.2;
            padding: 20px;
            background-color: #15151e;
            overflow-y: auto;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #score-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--egg-color);
            text-shadow: 0 0 10px rgba(225, 177, 44, 0.3);
        }

        #stats {
            font-size: 1.2rem;
            color: #a4b0be;
            margin-bottom: 40px;
            background: #2d2d3a;
            padding: 10px 20px;
            border-radius: 8px;
        }

        #click-button {
            font-size: 150px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 40px rgba(251, 197, 49, 0.4));
        }

        #click-button:active {
            transform: scale(0.85);
        }

        h2 {
            border-bottom: 2px solid var(--panel-bg);
            padding-bottom: 10px;
            margin-top: 0;
            color: var(--accent-color);
            position: sticky;
            top: 0;
            background-color: #15151e;
            z-index: 10;
            padding-top: 10px;
        }

        .upgrade-card {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            border-left: 4px solid transparent;
        }

        .upgrade-card:hover {
            background-color: var(--hover-bg);
            border-left: 4px solid var(--accent-color);
        }

        .upgrade-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-left: 4px solid transparent;
        }

        .upgrade-info h3 {
            margin: 0 0 5px 0;
            color: var(--text-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #a4b0be;
        }

        .upgrade-cost {
            font-weight: bold;
            font-size: 1rem;
            color: var(--egg-color);
            margin-top: 5px;
            display: inline-block;
        }

        .upgrade-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            min-width: 40px;
            text-align: right;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--panel-bg); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-bg); }
    </style>
</head>
<body>

    <div id="left-panel">
        <h1>Blox Egg Clicker</h1>
        <div id="score-display">0 Eggs</div>
        <div id="stats">
            <span id="cps-display">0</span> Eggs/sec &nbsp;|&nbsp; 
            <span id="cpc-display">1</span> Eggs/click
        </div>
        
        <button id="click-button" onclick="clickMain()">🥚</button>
    </div>

    <div id="right-panel">
        <h2>Power Shop</h2>
        <div id="store-container">
            <!-- Upgrades generated here -->
        </div>
    </div>

    <script>
        // Game State Variables
        let score = 0;
        let eggsPerSecond = 0;
        let eggsPerClick = 1;

        // Categorized Lists
        const fightingStyles = ["Combat", "Dark Step", "Death Step", "Dragon Breath", "Dragon Talon", "Electric", "Electric Claw", "Godhuman", "Sanguine Art", "Sharkman Karate", "Superhuman", "Water Kung Fu"];
        const fruits = ["Barrier", "Blade", "Blizzard", "Bomb", "Buddha", "Chop", "Control", "Creation", "Dark", "Diamond", "Door", "Dough", "Dragon", "Dragon (Classic)", "Eagle", "Falcon", "Flame", "Gas", "Ghost", "Gravity", "Ice", "Kilo", "Kitsune", "Leopard", "Light", "Lightning", "Love", "Magma", "Mammoth", "Meme", "Meme (Obtainable)", "Pain", "Phoenix", "Portal", "Quake", "Revive", "Rocket", "Rogue", "Rubber", "Sand", "Shadow", "Smoke", "Soul", "Sound", "Spider", "Spike", "Spin", "Spirit", "Spring", "T-Rex", "Tiger", "Venom", "Yeti"];
        const swords = ["Bisento", "Buddy Sword", "Canvander", "Cursed Dual Katana", "Cutlass", "Dark Blade", "Dark Dagger", "Dragon Trident", "Dragonheart", "Dual Katana", "Dual-Headed Blade", "Fishing Trophy", "Flail", "Fox Lamp", "Gravity Blade", "Hallow Scythe", "Iron Mace", "Katana", "Koko", "Longsword", "Midnight Blade", "Oroshi", "Pipe", "Pole (1st Form)", "Pole (2nd Form)", "Rengoku", "Saber", "Saishi", "Shark Anchor", "Shark Saw", "Shizu", "Soul Cane", "Spikey Trident", "Trident", "Triple Dark Blade", "Triple Katana", "True Triple Katana", "Tushita", "Twin Hooks", "Wardens Sword", "Yama"];
        const guns = ["Acidum Rifle", "Bazooka", "Bizarre Revolver", "Bizarre Rifle", "Cannon", "Dragonstorm", "Dual Flintlock", "Flintlock", "Kabucha", "Magma Blaster", "Musket", "Refined Flintlock", "Refined Musket", "Refined Slingshot", "Shotgun", "Skull Guitar", "Slingshot", "Venom Bow"];

        let globalIndex = 0;
        const storeItems = [];

        // Function to build the store items logically
        function addItem(name, category, type) {
            // Costs scale globally so the game gets progressively harder
            let baseCost = Math.floor(15 * Math.pow(1.22, globalIndex));
            let power = Math.floor(1 * Math.pow(1.16, globalIndex));
            if (power < 1) power = 1;

            storeItems.push({
                id: name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(),
                name: name,
                category: category,
                description: type === 'click' ? `+${formatNumber(power)} Eggs per click` : `+${formatNumber(power)} Eggs per sec`,
                baseCost: baseCost,
                cost: baseCost,
                count: 0,
                type: type,
                power: power
            });
            globalIndex++;
        }

        // Add items in order with their specific mechanics!
        fightingStyles.forEach(name => addItem(name, 'Fighting Style', 'click'));
        fruits.forEach(name => addItem(name, 'Fruit', 'auto'));
        swords.forEach(name => addItem(name, 'Sword', 'click'));
        guns.forEach(name => addItem(name, 'Gun', 'auto'));

        // Formatter for huge numbers (M, B, T, Qa, Qi)
        function formatNumber(num) {
            if (num >= 1e18) return (num / 1e18).toFixed(2) + ' Qi'; 
            if (num >= 1e15) return (num / 1e15).toFixed(2) + ' Qa'; 
            if (num >= 1e12) return (num / 1e12).toFixed(2) + ' T';  
            if (num >= 1e9) return (num / 1e9).toFixed(2) + ' B';    
            if (num >= 1e6) return (num / 1e6).toFixed(2) + ' M';    
            return Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Core Game Functions
        function clickMain() {
            score += eggsPerClick;
            updateUI();
        }

        function buyItem(index) {
            let item = storeItems[index];

            if (score >= item.cost) {
                score -= item.cost;
                item.count++;

                if (item.type === 'click') {
                    eggsPerClick += item.power;
                } else if (item.type === 'auto') {
                    eggsPerSecond += item.power;
                }

                item.cost = Math.ceil(item.baseCost * Math.pow(1.15, item.count));

                renderStore();
                updateUI();
            }
        }

        // UI Updates
        function updateUI() {
            document.getElementById('score-display').innerText = formatNumber(score) + ' Eggs';
            document.getElementById('cps-display').innerText = formatNumber(eggsPerSecond);
            document.getElementById('cpc-display').innerText = formatNumber(eggsPerClick);

            const cards = document.querySelectorAll('.upgrade-card');
            cards.forEach((card, index) => {
                if (score >= storeItems[index].cost) {
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                }
            });
        }

        function renderStore() {
            const container = document.getElementById('store-container');
            container.innerHTML = ''; 

            storeItems.forEach((item, index) => {
                const card = document.createElement('div');
                const disabledClass = score >= item.cost ? '' : 'disabled';
                
                card.className = `upgrade-card ${disabledClass}`;
                card.onclick = () => buyItem(index);

                // Determine tag colors based on category
                let tagColor;
                if (item.category === 'Fighting Style') tagColor = '#e17055'; // Orange-Red
                else if (item.category === 'Fruit') tagColor = '#a29bfe'; // Purple
                else if (item.category === 'Sword') tagColor = '#00cec9'; // Cyan
                else if (item.category === 'Gun') tagColor = '#ffeaa7'; // Yellow

                const tag = `<span style="color:${tagColor}; font-size:0.7rem; font-weight:bold; letter-spacing:1px; text-transform:uppercase; border: 1px solid ${tagColor}; padding: 2px 6px; border-radius: 4px;">${item.category}</span>`;

                card.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${item.name} ${tag}</h3>
                        <p>${item.description}</p>
                        <span class="upgrade-cost">Cost: ${formatNumber(item.cost)} Eggs</span>
                    </div>
                    <div class="upgrade-count">${item.count}</div>
                `;
                container.appendChild(card);
            });
        }

        // Game Loop (Runs 10 times a second for smoother numbers)
        setInterval(() => {
            if (eggsPerSecond > 0) {
                score += (eggsPerSecond / 10);
                updateUI();
            }
        }, 100);

        // Initial setup
        renderStore();
        updateUI();

    </script>
</body>
</html>
